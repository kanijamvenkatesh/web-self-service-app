<md-content class="md-padding">
    <div class="md-whiteframe-z1" style="background: white; border-radius: 4px; padding: 24px;">
        <h2 class="md-title" style="color: #1b365d; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">Apply for Letter of Credit</h2>
        
        <form name="lcForm" ng-submit="vm.applyLc()">
            <div layout="column">
                <md-input-container>
                    <label>Beneficiary / Seller Name</label>
                    <input type="text" ng-model="vm.newLc.sellerName" required>
                </md-input-container>

                <div layout="row" layout-sm="column">
                    <md-input-container flex>
                        <label>LC Amount</label>
                        <input type="number" ng-model="vm.newLc.amount" ng-change="vm.calculateMargin()" required>
                    </md-input-container>

                    <md-input-container flex="30">
                        <label>Currency</label>
                        <md-select ng-model="vm.newLc.currency" required>
                            <md-option value="USD">USD</md-option>
                            <md-option value="EUR">EUR</md-option>
                            <md-option value="GBP">GBP</md-option>
                            <md-option value="INR">INR</md-option>
                        </md-select>
                    </md-input-container>
                    
                    <md-input-container flex>
                        <label>Collateral Margin (%)</label>
                        <input type="number" ng-model="vm.newLc.marginPercent" ng-change="vm.calculateMargin()" required>
                    </md-input-container>
                </div>
                
                <div style="background: #f1f5f9; padding: 12px; margin-bottom: 16px; border-radius: 4px;">
                    <strong>Lien Hold Amount:</strong> <span style="color: #1b365d; font-weight: 700;">{{ (vm.newLc.amount * (vm.newLc.marginPercent / 100)) | currency:vm.newLc.currency+' ' }}</span>
                </div>

                <md-input-container>
                    <label>Goods Description</label>
                    <textarea ng-model="vm.newLc.goodsDescription" rows="2" required></textarea>
                </md-input-container>

                <div layout="row" layout-sm="column">
                    <md-input-container flex>
                        <label>Port of Loading</label>
                        <input type="text" ng-model="vm.newLc.portOfLoading" required>
                    </md-input-container>

                    <md-input-container flex>
                        <label>Port of Discharge</label>
                        <input type="text" ng-model="vm.newLc.portOfDischarge" required>
                    </md-input-container>
                </div>
            </div>

            <div layout="row" layout-align="end center">
                <!-- RED Cancel Button per Policy -->
                <md-button class="md-raised premium-btn-cancel" ui-sref="app.tradefinance({showApply: false})">Cancel</md-button>
                <!-- BLUE Submit Button per Policy -->
                <md-button class="md-raised premium-btn-submit" type="submit" ng-disabled="lcForm.$invalid">Submit LC Application</md-button>
            </div>
        </form>
    </div>
</md-content>
